# ==============================================================================
# BookRAG AI - Docker Compose Configuration (Phase 0 Skeleton / Placeholder)
# ==============================================================================
# NOTE: This file is intentionally NOT used for Phase 0.
# Phase 0 runs as a lightweight local Python FastAPI service.
#
# In future phases, services will be enabled incrementally:
# - backend: FastAPI application
# - db: PostgreSQL + pgvector
# - cache: Redis for async task queues and caching
# - worker: Celery / background worker for PDF ingestion & embeddings
# - frontend: React + TypeScript + Vite UI
# ==============================================================================

version: "3.8"
services:
  # PostgreSQL persistent system of record + pgvector (Phase 13 / 14)
  db:
    image: pgvector/pgvector:pg16
    container_name: bookrag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookrag
      POSTGRES_PASSWORD: bookrag_password
      POSTGRES_DB: bookrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis message broker for Celery (Phase 15)
  redis:
    image: redis:7-alpine
    container_name: bookrag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

